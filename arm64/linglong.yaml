version: "1"

package:
  id: org.deepin.runtime.wine
  name: deepin wine runtime
  kind: runtime
  version: 23.0.0.3
  description: |
    Wine is a compatibility layer capable of running Windows applications  
    on Unix-like operating systems. It provides both a development toolkit  
    for porting Windows sources to Unix and a program loader, allowing many  
    unmodified Windows binaries to run on x86, x86_64, and ARM architectures.


base: org.deepin.base.wine/23.0.0/arm64

sources:
  - kind: file
    url: https://aptly.uniontech.com/pkg/nonfree-eagle/release-candidate/d2luZTgtcnVudGltZTIyMDI0LTA5LTAzIDEzOjE1OjAx/pool/non-free/d/deepin-box64/deepin-box64_0.2.6deepin11-1_arm64.deb
    digest: 960c3f370c78652a96c5aa0e78aafcfae1586bacea6cf245309e49a1f9603746
  - kind: file
    url: http://10.0.32.76/deepin-wine/1041a7acff0/signed_deepin-wine8-stable_8.16deepin25_arm64.deb
    digest: bca59a66c685440585b9e940997be9fb7fc9632139f9e18fd7293b96fc11e67c
  - kind: file
    url: https://aptly.uniontech.com/pkg/nonfree-eagle/release-candidate/44CQd2luZeW6lOeUqOOAkWhlbHBlcuS-nei1ljIwMjQtMDctMjcgMTk6MTY6Mjc/pool/non-free/d/deepin-wine-helper/com.wine-helper.deepin_5.3.21-1_arm64.deb
    digest: 733b4d191205b9c9abdfcc8e5b3366aa2b7f29485fbc83451ab000580c830c9c

build: |
  # 设置.deb包的路径  
  SOURCES="linglong/sources"  
  DEB_PACKAGE_WINE="$SOURCES/signed_deepin-wine8-stable_8.16deepin25_arm64.deb"  
  DEB_PACKAGE_HELPER="$SOURCES/com.wine-helper.deepin_5.3.21-1_arm64.deb"
  DEB_PACKAGE_BOX="$SOURCES/deepin-box64_0.2.6deepin11-1_arm64.deb"

  # 使用dpkg-deb解压.deb包的runtime部分到临时目录  
  TEMP_DIR="$(mktemp -d)"  
  dpkg-deb -x "$DEB_PACKAGE_WINE" "$TEMP_DIR"  
  dpkg-deb -x "$DEB_PACKAGE_HELPER" "$TEMP_DIR" 
  dpkg-deb -x "$DEB_PACKAGE_BOX" "$TEMP_DIR"

  # 更新原本/usr/bin/deepin-box64脚本的内容
  sed -i '/deepin-box64/d' $TEMP_DIR/usr/bin/deepin-box64  
  sed -i '$a parent_dir=$(dirname "$(realpath "$0")")' $TEMP_DIR/usr/bin/deepin-box64
  sed -i '$a grandparent_dir=$(dirname "$parent_dir")' $TEMP_DIR/usr/bin/deepin-box64
  sed -i '$a export BOX64_LD_LIBRARY_PATH="$grandparent_dir/deepin-box64/lib/x86_64-linux-gnu:$BOX64_LD_LIBRARY_PATH"' $TEMP_DIR/usr/bin/deepin-box64
  sed -i '$a $grandparent_dir/deepin-box64/box64 "$@"'

  #更新原本/usr/bin/deepin-wine8-stable脚本的内容
  sed -i '/deepin-wine8-stable/d' $TEMP_DIR/usr/bin/deepin-wine8-stable
  sed -i '$a parent_dir=$(dirname "$(realpath "$0")")' $TEMP_DIR/usr/bin/deepin-wine8-stable
  sed -i '$a grandparent_dir=$(dirname "$parent_dir")' $TEMP_DIR/usr/bin/deepin-wine8-stable
  sed -i '$a export WINEDLLPATH=$grandparent_dir/deepin-wine8-stable/lib/wine' $TEMP_DIR/usr/bin/deepin-wine8-stable
  sed -i '$a deepin-box64 $grandparent_dir/deepin-wine8-stable/bin/wine "$@"' $TEMP_DIR/usr/bin/deepin-wine8-stable

  #更新原本/opt/deepinwine/tools/run_v4.sh脚本的内容
  sed -i 's/\/opt\/deepinwine/\/runtime\/deepinwine/g' $TEMP_DIR/opt/deepinwine/tools/run_v4.sh
  sed -i 's/\/opt\/deepinemu/\/runtime\/deepinemu/g' $TEMP_DIR/opt/deepinwine/tools/run_v4.sh
  sed -i 's/WINEPREFIX="$HOME\/.deepinwine\/$1"/WINEPREFIX="$HOME\/.linglong\/$1"/g' $TEMP_DIR/opt/deepinwine/tools/run_v4.sh

  # 检查解压后的目录结构，并释放/opt目录到/runtime  
  OPT_PATH="$TEMP_DIR/opt"  
  if [ -d "$OPT_PATH" ]; then  
      # 释放opt目录到/runtime  
      # 使用rsync来避免复制过程中的一些问题，比如链接和特殊文件  
      rsync -avh --progress "$OPT_PATH"/ /runtime/  
  fi   

  USR_PATH="$TEMP_DIR/usr"  
  if [ -d "$USR_PATH" ]; then  
      # 释放usr目录到/runtime  
      # 使用rsync来避免复制过程中的一些问题，比如链接和特殊文件  
      rsync -avh --progress "$USR_PATH"/ /runtime/  
  fi   

  # 清理临时目录  
  rm -rf "$TEMP_DIR"  
